# Example for the classic hyprlang config (hyprland.conf).

# load the plugin (adjust the path; hyprpm users use `exec-once = hyprpm reload -n` instead)
plugin = ~/.local/share/hypr-cursortrail/libcursortrail.so

# the circle cursor needs software cursors
cursor {
    no_hardware_cursors = 1
}

plugin {
    cursortrail {
        lifetime = 175
        opacity = 0.75
        blend = additive
        color = rgb(ff5800)
        gradient = true
        tail_color = rgb(ffd84a)
        hide_in_fullscreen = false

        cursor = true
        cursor_size = 11
        cursor_ring = 4
        cursor_color = rgb(ffe600)
        cursor_center_color = rgb(ffffff)
    }
}
